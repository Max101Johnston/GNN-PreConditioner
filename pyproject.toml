[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-amg-coarsening"
version = "0.1.0"
description = "Two-stage GNN coarse-DOF selection for fixed numerical multigrid"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
